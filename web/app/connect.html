<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>LingXi · Connecting</title>
<style>
  html,body{height:100%;margin:0;background:#0b0f14;color:#eef3f8;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;align-items:center;justify-content:center}
  .box{text-align:center;padding:24px;max-width:420px}
  .spinner{width:38px;height:38px;margin:0 auto 18px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:#5b9dff;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .title{font-size:16px;font-weight:600;margin-bottom:8px}
  .sub{font-size:13px;color:#8996a8;line-height:1.7}
  .btn{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;
    background:#5b9dff;color:#06101a;text-decoration:none;font-weight:700;font-size:14px}
  .err .spinner{display:none}
  .err .title{color:#f87171}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spinner"></div>
  <div class="title" id="title">正在接管你的灵犀…</div>
  <div class="sub" id="sub">Connecting to your LingXi engine…</div>
  <a class="btn" id="retry" href="/app/" style="display:none">返回 / Back</a>
</div>
<script>
(function () {
  var L = (function () {
    var n = (navigator.language || 'zh').toLowerCase();
    if (n.indexOf('zh') === 0) return (n.indexOf('tw') >= 0 || n.indexOf('hk') >= 0 || n.indexOf('hant') >= 0) ? 'tw' : 'zh';
    return 'en';
  })();
  var TXT = {
    zh: { loading: '正在接管你的灵犀…', sub: '手机不跑模型，算力仍在你的引擎上', fail: '接管失败或已过期', failSub: '请在手机上重新点一次「接管」', back: '返回' },
    tw: { loading: '正在接管你的靈犀…', sub: '手機不執行模型，算力仍在你的引擎上', fail: '接管失敗或已過期', failSub: '請在手機上重新點一次「接管」', back: '返回' },
    en: { loading: 'Taking over your LingXi…', sub: 'Your phone runs no models — compute stays on your engine', fail: 'Link expired or invalid', failSub: 'Tap “Take over” again on your phone', back: 'Back' }
  }[L];

  document.getElementById('title').textContent = TXT.loading;
  document.getElementById('sub').textContent = TXT.sub;

  function fail(msg) {
    var box = document.getElementById('box');
    box.classList.add('err');
    document.getElementById('title').textContent = TXT.fail;
    document.getElementById('sub').textContent = msg || TXT.failSub;
    var r = document.getElementById('retry');
    r.style.display = 'inline-block';
    r.textContent = TXT.back;
  }

  var qs = new URLSearchParams(location.search);
  var ticket = qs.get('ticket');
  var hub = qs.get('hub') || '';
  if (!ticket) { fail(); return; }

  fetch('/api/app/ticket/redeem', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticket: ticket, hub: hub })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      var d = res.d || {};
      if (!res.ok || !d.ok || !(d.accessToken || d.token)) throw new Error(d.error || 'redeem_failed');
      var tk = d.accessToken || d.token;
      try {
        localStorage.setItem('authToken', tk);
        var u = d.user || {};
        if (u.id) localStorage.setItem('userId', String(u.id));
        if (u.displayName) localStorage.setItem('displayName', String(u.displayName));
        localStorage.setItem('lingxi-app-user', JSON.stringify(u));
        localStorage.setItem('lingxi-app-endpoint', location.origin);
      } catch (e) { }
      location.replace('/m/');
    })
    .catch(function (e) { fail(e && e.message && e.message !== 'redeem_failed' ? e.message : ''); });
})();
</script>
</body>
</html>
