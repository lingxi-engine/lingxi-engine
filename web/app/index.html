<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>灵犀 · LingXi</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div id="app">

  <!-- 顶部 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="logo">犀</div>
      <div class="brand-text">
        <div class="brand-name" data-i18n="app.name">灵犀</div>
        <div class="brand-sub" id="brandSub">LINGXI</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn" aria-label="language">
        <span id="langLabel">中文</span><span class="caret">▾</span>
      </button>
    </div>
  </header>

  <!-- 语言选择 -->
  <div class="sheet-mask" id="langMask" hidden>
    <div class="sheet">
      <div class="sheet-title" data-i18n="settings.lang">语言 / Language</div>
      <button class="lang-item" data-lang="zh">🇨🇳 简体中文</button>
      <button class="lang-item" data-lang="zh-TW">🇭🇰 繁體中文</button>
      <button class="lang-item" data-lang="en">🌍 English</button>
      <button class="sheet-cancel" data-i18n="common.cancel">取消</button>
    </div>
  </div>

  <!-- 登录 -->
  <section class="screen" id="loginScreen">
    <div class="hero">
      <div class="hero-glow"></div>
      <h1 class="hero-title" data-i18n="login.title">登录你的灵犀</h1>
      <p class="hero-sub" data-i18n="login.sub">用同一个账号，操控你在云端和电脑上的灵犀</p>
    </div>

    <form class="card form" id="loginForm" autocomplete="on">
      <label class="field">
        <span class="field-label" data-i18n="login.email">邮箱 / 账号</span>
        <input id="email" type="text" inputmode="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field-label" data-i18n="login.password">密码</span>
        <div class="pwd-wrap">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pwd-eye" id="eyeBtn" aria-label="show password">👁</button>
        </div>
      </label>

      <button type="button" class="link-btn" id="advToggle" data-i18n="login.advanced">连接自建引擎 / 局域网电脑</button>
      <div class="adv" id="advBox" hidden>
        <label class="field">
          <span class="field-label" data-i18n="login.endpoint">引擎地址</span>
          <input id="endpoint" type="url" inputmode="url" placeholder="https://my-lingxi.example.com">
        </label>
        <div class="adv-row">
          <button type="button" class="mini-btn" id="pingBtn" data-i18n="login.ping">测试连接</button>
          <button type="button" class="mini-btn" id="useCloudBtn" data-i18n="login.useCloud">恢复官方云端</button>
        </div>
        <div class="adv-status" id="advStatus"></div>
      </div>

      <button class="primary" id="loginBtn" type="submit" data-i18n="login.btn">登录</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>

    <p class="foot-note" data-i18n="login.note">手机不跑模型，所有算力都在你的电脑或云端引擎上。</p>
  </section>

  <!-- 设备列表 -->
  <section class="screen" id="homeScreen" hidden>
    <div class="user-row">
      <div class="user-chip">
        <div class="avatar" id="avatar">L</div>
        <div class="user-meta">
          <div class="user-name" id="userName">LingXi</div>
          <div class="user-email" id="userEmail"></div>
        </div>
      </div>
      <button class="icon-btn" id="logoutBtn" title="logout">⏏</button>
    </div>

    <div class="section-head">
      <div>
        <h2 data-i18n="dev.title">我的灵犀</h2>
        <p class="section-sub" id="devSub"></p>
      </div>
      <button class="refresh" id="refreshBtn" aria-label="refresh">⟳</button>
    </div>

    <div class="devices" id="devices"></div>

    <div class="empty" id="emptyBox" hidden>
      <div class="empty-icon">🛰️</div>
      <div class="empty-title" data-i18n="dev.empty">还没有发现你的灵犀</div>
      <div class="empty-hint" data-i18n="dev.emptyHint">在电脑上打开灵犀并登录同一账号，它就会自动出现在这里。</div>
    </div>

    <button class="ghost-btn" id="addBtn"><span>＋</span> <span data-i18n="dev.add">添加电脑</span></button>

    <details class="help card">
      <summary data-i18n="help.title">怎么让电脑出现在这里？</summary>
      <ol class="help-list">
        <li data-i18n="help.step1">电脑上启动灵犀引擎</li>
        <li data-i18n="help.step2">用同一个账号登录</li>
        <li data-i18n="help.step3">保持引擎运行，手机会自动发现</li>
      </ol>
    </details>
  </section>

  <!-- 加载遮罩 -->
  <div class="loading-mask" id="loadingMask" hidden>
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText"></div>
  </div>

  <!-- 添加电脑弹层 -->
  <div class="sheet-mask" id="addMask" hidden>
    <div class="sheet">
      <div class="sheet-title" data-i18n="dev.addTitle">添加自己的电脑</div>
      <p class="sheet-hint" data-i18n="dev.addHint">填电脑上灵犀的地址，例如 http://192.168.1.10:3456</p>
      <input class="sheet-input" id="addEndpoint" type="url" inputmode="url" placeholder="http://192.168.1.10:3456">
      <div class="adv-status" id="addStatus"></div>
      <button class="primary" id="addConfirm" data-i18n="dev.addBtn">连接</button>
      <button class="sheet-cancel" data-i18n="common.cancel">取消</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
<script src="/app/app.js"></script>
</body>
</html>
