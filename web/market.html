<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵犀市场 — 多品类交易市场</title>
<link rel="stylesheet" href="market.css">
  <!-- [FEATURE_MARKET] 市场功能已暂时下线 -->
  <script>location.replace('/app/');</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="home">← 回首页</a>
    <h1>🛒 灵犀市场</h1>
    <div class="topbar-right">
      <span id="userBar" style="display:none"></span>
      <span id="creditsDisplay" class="credits-badge" style="display:none">🪙 0</span>
      <span id="walletDisplay" class="credits-badge" style="display:none">💰 钱包 0</span>
      <button class="btn-primary" style="font-size:11px;padding:3px 10px;margin-left:6px" onclick="openRecharge()">➕ 充值</button>
      <span id="connStatus" class="conn-dot">🔴 连接中</span>
    </div>
  </div>
</header>

<main class="container">
  <nav class="tabs">
    <button class="tab active" data-tab="market" onclick="switchTab('market')">🏪 逛市场</button>
    <button class="tab" data-tab="mylistings" onclick="switchTab('mylistings')">📦 我的发布</button>
    <button class="tab" data-tab="employees" onclick="switchTab('employees')">👥 我的员工</button>
  </nav>

  <!-- 市场 Tab -->
  <div id="tab-market">
    <div id="typeTabs" class="type-tabs"></div>

    <div class="market-toolbar">
      <div>
        <button class="btn-primary btn-big" onclick="openPublish()">🚀 发布商品</button>
        <span class="toolbar-hint">AI员工 · 音乐 · 视频 · 漏洞悬赏 · 游戏素材 · MCP · 技能包</span>
      </div>
    </div>
    <div id="listingGrid" class="listing-grid"></div>
  </div>

  <!-- 我的发布 Tab -->
  <div id="tab-mylistings" style="display:none">
    <div class="section-title"><h2>📦 我的发布</h2><button class="btn-primary" onclick="switchTab('market')">＋ 去发布</button></div>
    <div id="myListingsGrid" class="listing-grid"></div>
  </div>

  <!-- 员工 Tab -->
  <div id="tab-employees" style="display:none">
    <div class="section-title"><h2>👥 我雇佣的员工</h2></div>
    <div id="myEmployees"></div>
    <hr class="divider">
    <div class="section-title"><h2>🔌 我被雇佣</h2></div>
    <div id="hiredMe"></div>
  </div>
</main>

<!-- 发布弹窗 -->
<div id="publishModal" class="modal-overlay" style="display:none">
  <div class="modal modal-wide">
    <h3>🚀 发布商品到市场</h3>
    <p id="pubHint" class="modal-hint" style="color:#4f8cff">发布你的 AI 员工到市场供人雇佣</p>
    <label>商品类型</label>
    <select id="pubItemType" onchange="onTypeChange()">
      <option value="agent">🤖 AI员工</option>
      <option value="music">🎵 音乐成品</option>
      <option value="video">🎬 视频成品</option>
      <option value="bounty">🛡️ 漏洞悬赏</option>
      <option value="asset">🎮 游戏素材</option>
      <option value="mcp">🔌 MCP服务</option>
      <option value="skill">🧩 技能包</option>
    </select>
    <div id="pubAgentRow">
      <label>Agent ID（AI员工的标识）</label>
      <input id="pubAgentId" placeholder="如 ag-xxxx">
    </div>
    <label>商品名称</label>
    <input id="pubTitle" placeholder="给商品起个响亮的名字">
    <label>分类</label>
    <select id="pubCategory">
      <option>通用</option><option>编程</option><option>写作</option><option>翻译</option><option>数据分析</option><option>设计</option><option>音乐</option><option>视频</option><option>游戏</option><option>安全</option><option>工具</option>
    </select>
    <label>计价币种</label>
    <select id="pubCurrency" onchange="onCurrencyChange()">
      <option value="credits">🪙 积分</option>
      <option value="usd">💵 美元 USD</option>
      <option value="cny">💰 人民币 CNY</option>
    </select>
    <label id="pubPriceLabel">价格（积分，最低 10）</label>
    <input id="pubPrice" type="number" value="10" min="0" step="0.01">
    <label>时长（0=永久买断，仅 AI员工）</label>
    <div style="display:flex;gap:8px">
      <input id="pubDuration" type="number" value="0" min="0" style="flex:1">
      <select id="pubDurationUnit" style="flex:1">
        <option value="permanent">永久买断</option>
        <option value="minute">分钟</option>
        <option value="hour">小时</option>
        <option value="day">天</option>
      </select>
    </div>
    <div id="pubMediaRow" style="display:none">
      <label>试听/试看链接（音频 mp3 / 视频 mp4 等）</label>
      <input id="pubPreviewUrl" placeholder="https://.../preview.mp3">
    </div>
    <div id="pubFileRow" style="display:none">
      <label>成品文件链接（购买后交付 / 下载）</label>
      <input id="pubFileUrl" placeholder="https://.../file.zip">
    </div>
    <div id="pubLicenseRow" style="display:none">
      <label>授权方式（如：商用授权 / 独家版权 / 开源 / 个人使用）</label>
      <input id="pubLicense" placeholder="商用授权">
    </div>
    <label>标签（逗号分隔）</label>
    <input id="pubTags" placeholder="如: 编曲, 流行, 完整母带">
    <label>描述</label>
    <textarea id="pubDesc" rows="3" placeholder="详细介绍商品亮点..."></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closePublish()">取消</button>
      <button class="btn-confirm" onclick="publishAgent()">🚀 发布</button>
    </div>
  </div>
</div>

<!-- 雇佣/购买弹窗 -->
<div id="hireModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>⚠️ 确认交易</h3>
    <p id="hireModalText"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeHireModal()">取消</button>
      <button class="btn-confirm" onclick="confirmHire()">✅ 确认</button>
    </div>
  </div>
</div>

<!-- 充值弹窗（模拟） -->
<div id="rechargeModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>💰 钱包充值（模拟）</h3>
    <p style="color:#888;font-size:12px">当前为演示模式，未接入真实支付，充值只增加账户余额（后续可接支付宝/微信/Stripe）。</p>
    <label>币种</label>
    <select id="rechargeCurrency">
      <option value="usd">💵 美元 USD</option>
      <option value="cny">💰 人民币 CNY</option>
    </select>
    <label>金额</label>
    <input id="rechargeAmount" type="number" value="100" min="1" step="0.01">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRecharge()">取消</button>
      <button class="btn-confirm" onclick="doRecharge()">✅ 充值</button>
    </div>
  </div>
</div>

<!-- 媒体预览弹窗 -->
<div id="mediaModal" class="modal-overlay" style="display:none" onclick="closeMediaModal()">
  <div class="modal modal-wide" onclick="event.stopPropagation()">
    <h3>🎧 预览</h3>
    <div id="mediaModalBody"></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeMediaModal()">关闭</button></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="editModal" class="modal-overlay" style="display:none">
  <div class="modal modal-wide">
    <h3>✏️ 编辑商品</h3>
    <label>商品名称</label>
    <input id="editTitle">
    <label>描述</label>
    <textarea id="editDesc" rows="2"></textarea>
    <label>分类</label>
    <select id="editCategory">
      <option>通用</option><option>编程</option><option>写作</option><option>翻译</option><option>数据分析</option><option>设计</option><option>音乐</option><option>视频</option><option>游戏</option><option>安全</option><option>工具</option>
    </select>
    <label>价格（积分，最低10）</label>
    <input id="editPrice" type="number" min="10">
    <label>时长（0=永久买断）</label>
    <div style="display:flex;gap:8px">
      <input id="editDuration" type="number" min="0" style="flex:1">
      <select id="editDurationUnit" style="flex:1">
        <option value="permanent">永久买断</option>
        <option value="minute">分钟</option>
        <option value="hour">小时</option>
        <option value="day">天</option>
      </select>
    </div>
    <label>试听/试看链接</label>
    <input id="editPreviewUrl">
    <label>成品文件链接</label>
    <input id="editFileUrl">
    <label>授权方式</label>
    <input id="editLicense">
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn-cancel" onclick="closeEditModal()">取消</button>
      <button class="btn-confirm" onclick="submitEditListing()">保存</button>
    </div>
  </div>
</div>

<!-- 评价弹窗 -->
<div id="rateModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>⭐ 评价交易</h3>
    <label>评分</label>
    <select id="rateScore">
      <option value="5">⭐⭐⭐⭐⭐ 非常满意</option>
      <option value="4">⭐⭐⭐⭐ 满意</option>
      <option value="3">⭐⭐⭐ 一般</option>
      <option value="2">⭐⭐ 不满意</option>
      <option value="1">⭐ 很差</option>
    </select>
    <label>评价内容（可选）</label>
    <textarea id="rateReview" rows="3" placeholder="说说这次交易的体验..."></textarea>
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn-cancel" onclick="closeRateModal()">取消</button>
      <button class="btn-confirm" onclick="submitRate()">提交评价</button>
    </div>
  </div>
</div>

<script src="market.js"></script>
</body>
</html>
