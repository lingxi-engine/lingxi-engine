<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵犀引擎 - 请登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#0d1117;color:#c9d1d9;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 50% 0%,#161b2288 0%,#0d1117 70%);
}
.card{
  width:100%;max-width:400px;background:#161b22;border:1px solid #30363d;
  border-radius:16px;padding:40px 32px;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{
  width:64px;height:64px;margin:0 auto 12px;border-radius:16px;
  background:linear-gradient(135deg,#58a6ff,#a371f7);
  display:flex;align-items:center;justify-content:center;font-size:32px;
}
.logo h1{font-size:22px;font-weight:700;color:#e6edf3}
.logo p{font-size:13px;color:#8b949e;margin-top:4px}
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid #30363d}
.tab{
  flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;
  cursor:pointer;color:#8b949e;border-bottom:2px solid transparent;transition:.2s;
}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.tab:hover{color:#c9d1d9}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
.form-group input{
  width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;
  border-radius:8px;color:#c9d1d9;font-size:14px;outline:none;transition:.2s;
}
.form-group input:focus{border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.15)}
.btn{
  width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;
  cursor:pointer;transition:.2s;margin-top:8px;
}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.msg{text-align:center;font-size:13px;margin-top:12px;min-height:20px}
.msg.err{color:#f85149}
.msg.ok{color:#3fb950}
.form-section{display:none}
.form-section.active{display:block}
.hint{text-align:center;font-size:12px;color:#484f58;margin-top:20px}
.hint a{color:#58a6ff;text-decoration:none;cursor:pointer}
.local-note{
  text-align:center;font-size:12px;color:#8b949e;margin-top:16px;
  padding:10px;background:#0d1117;border-radius:8px;border:1px solid #21262d;
}
.local-note code{background:#21262d;padding:2px 6px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🔮</div>
    <h1>灵犀引擎</h1>
    <p>AI 智能体平台 · 请登录以继续</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">登录</div>
    <div class="tab" onclick="switchTab('register')">注册</div>
  </div>

  <!-- 登录表单 -->
  <div class="form-section active" id="loginForm">
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
  </div>

  <!-- 注册表单 -->
  <div class="form-section" id="registerForm">
    <div class="form-group">
      <label>显示名称</label>
      <input type="text" id="regName" placeholder="你的名字" autocomplete="name">
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>密码（至少6位）</label>
      <input type="password" id="regPwd" placeholder="设置密码" autocomplete="new-password">
    </div>
    <div class="form-group" id="inviteGroup">
      <label>邀请码（如需要）</label>
      <input type="text" id="regInvite" placeholder="邀请码">
    </div>
    <button class="btn btn-primary" id="regBtn" onclick="doRegister()">注册</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="hint">
    <span id="switchHint">没有账号？<a onclick="switchTab('register')">注册一个</a></span>
  </div>

  <div class="local-note" id="localNote">
    💡 本地/内网用户：引擎默认免登录，无需注册。<br>
    如看到此页面，说明你来自公网访问。
  </div>
</div>

<script>
// ── Cookie 工具（与后端 gate 中间件配合：公网访问需要 cookie 中的 authToken）──
function setAuthCookie(token) {
  // 30天过期，SameSite=Lax 防 CSRF，Path=/ 全站可用
  const expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toUTCString();
  document.cookie = 'authToken=' + encodeURIComponent(token) + '; expires=' + expires + '; path=/; SameSite=Lax';
}
function clearAuthCookie() {
  document.cookie = 'authToken=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (tab==='login'?i===0:i===1));
  });
  document.getElementById('loginForm').classList.toggle('active', tab==='login');
  document.getElementById('registerForm').classList.toggle('active', tab==='register');
  document.getElementById('switchHint').innerHTML = tab==='login'
    ? '没有账号？<a onclick="switchTab(\'register\')">注册一个</a>'
    : '已有账号？<a onclick="switchTab(\'login\')">去登录</a>';
  document.getElementById('msg').textContent = '';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

function saveToken(token, user) {
  localStorage.setItem('authToken', token);
  setAuthCookie(token);
  if (user) {
    if (user.id || user.sub) localStorage.setItem('userId', String(user.id || user.sub));
    if (user.numeric_id) localStorage.setItem('userId', String(user.numeric_id));
    if (user.display_name || user.displayName) localStorage.setItem('displayName', user.display_name || user.displayName);
  }
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPwd').value;
  if (!email || !password) return showMsg('请填写邮箱和密码', 'err');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error?.message || d.error || '登录失败');
    const token = d.token || d.accessToken;
    if (!token) throw new Error('未返回 token');
    saveToken(token, d.user);
    showMsg('登录成功，正在跳转...', 'ok');
    setTimeout(() => { window.location.href = '/?auth=1'; }, 500);
  } catch(e) {
    showMsg(e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function doRegister() {
  const display_name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPwd').value;
  const invite_code = document.getElementById('regInvite').value.trim();
  if (!email || !password) return showMsg('请填写邮箱和密码', 'err');
  if (password.length < 6) return showMsg('密码至少6位', 'err');
  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = '注册中...';
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, display_name: display_name || email.split('@')[0], invite_code: invite_code || undefined, agent_binding: 'auto_default' })
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error?.message || d.error || '注册失败');
    const token = d.token || d.accessToken;
    if (token) {
      saveToken(token, d.user);
      showMsg('注册成功，正在跳转...', 'ok');
      setTimeout(() => { window.location.href = '/?auth=1'; }, 500);
    } else {
      showMsg('注册成功！请登录', 'ok');
      setTimeout(() => switchTab('login'), 1000);
    }
  } catch(e) {
    showMsg(e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '注册';
  }
}

// Enter 键提交
document.getElementById('loginPwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('regPwd').addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });

// 如果已有 token 且在 URL 带了 auth=1，说明已经登录过了，直接跳走
const params = new URLSearchParams(window.location.search);
if (params.get('auth') && localStorage.getItem('authToken')) {
  window.location.href = '/';
}
</script>
</body>
</html>
