<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 背景径向渐变 -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="70%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </radialGradient>
    <!-- 核心发光 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="30%" style="stop-color:#fbbf24"/>
      <stop offset="60%" style="stop-color:#f59e0b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <!-- 蓝色环 -->
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <!-- 紫色环 -->
    <linearGradient id="ringPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <!-- 引擎核心渐变 -->
    <linearGradient id="engineCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="25%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="75%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <!-- 内部光晕 -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <!-- 外层光晕 -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlowFilter" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === 层1: 背景 === -->
  <circle cx="100" cy="100" r="98" fill="url(#bgRadial)"/>

  <!-- === 层2: 外层装饰环（虚线） === -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1e40af" stroke-width="0.3" opacity="0.3"/>

  <!-- === 层3: 外圈齿轮齿（12个，带渐变） === -->
  <g filter="url(#softGlow)">
    <!-- 12 个齿 -->
    <g stroke="url(#ringBlue)" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <line x1="100" y1="10" x2="100" y2="24"/>
      <line x1="100" y1="176" x2="100" y2="190"/>
      <line x1="10" y1="100" x2="24" y2="100"/>
      <line x1="176" y1="100" x2="190" y2="100"/>
      <line x1="27.6" y1="27.6" x2="38.2" y2="38.2"/>
      <line x1="161.8" y1="161.8" x2="172.4" y2="172.4"/>
      <line x1="172.4" y1="27.6" x2="161.8" y2="38.2"/>
      <line x1="38.2" y1="161.8" x2="27.6" y2="172.4"/>
      <line x1="40.7" y1="6.5" x2="44.8" y2="18.5"/>
      <line x1="155.2" y1="181.5" x2="159.3" y2="193.5"/>
      <line x1="193.5" y1="40.7" x2="181.5" y2="44.8"/>
      <line x1="18.5" y1="155.2" x2="6.5" y2="159.3"/>
    </g>
  </g>

  <!-- === 层4: 主环（蓝紫双色） === -->
  <!-- 上半圈蓝 -->
  <path d="M 100 16 A 84 84 0 0 1 184 100" fill="none" stroke="url(#ringBlue)" stroke-width="3" opacity="0.9" filter="url(#softGlow)"/>
  <!-- 下半圈紫 -->
  <path d="M 184 100 A 84 84 0 0 1 100 184" fill="none" stroke="url(#ringPurple)" stroke-width="3" opacity="0.9" filter="url(#softGlow)"/>
  <!-- 接缝处高光 -->
  <circle cx="100" cy="16" r="3" fill="#60a5fa" opacity="0.9" filter="url(#softGlow)"/>
  <circle cx="100" cy="184" r="3" fill="#a78bfa" opacity="0.9" filter="url(#softGlow)"/>

  <!-- === 层5: 内圈装饰 === -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#1e40af" stroke-width="0.3" stroke-dasharray="2 4" opacity="0.3"/>

  <!-- === 层6: 六边形蜂窝（AI 网络意象） === -->
  <g transform="translate(100,100)" opacity="0.6">
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21"
             fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
    <!-- 六个节点（AI 节点） -->
    <circle cx="0" cy="-42" r="3" fill="#60a5fa" opacity="0.8"/>
    <circle cx="36" cy="-21" r="3" fill="#60a5fa" opacity="0.8"/>
    <circle cx="36" cy="21" r="3" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="0" cy="42" r="3" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="-36" cy="21" r="3" fill="#3b82f6" opacity="0.7"/>
    <circle cx="-36" cy="-21" r="3" fill="#3b82f6" opacity="0.7"/>
    <!-- 节点连线（更亮） -->
    <line x1="0" y1="-42" x2="36" y2="-21" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
    <line x1="36" y1="-21" x2="36" y2="21" stroke="#6366f1" stroke-width="0.6" opacity="0.4"/>
    <line x1="36" y1="21" x2="0" y2="42" stroke="#6366f1" stroke-width="0.6" opacity="0.4"/>
    <line x1="0" y1="42" x2="-36" y2="21" stroke="#6366f1" stroke-width="0.6" opacity="0.4"/>
    <line x1="-36" y1="21" x2="-36" y2="-21" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
    <line x1="-36" y1="-21" x2="0" y2="-42" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- === 层7: 中心核心发光圈 === -->
  <circle cx="100" cy="100" r="38" fill="url(#innerGlow)" opacity="0.7"/>

  <!-- === 层8: 引擎主体 - 六边形外框 === -->
  <polygon points="100,62 134,76 134,124 100,138 66,124 66,76"
           fill="none" stroke="url(#engineCore)" stroke-width="3"
           filter="url(#outerGlow)" opacity="0.95"/>

  <!-- 六边形内部填充（很淡） -->
  <polygon points="100,64 132,77 132,123 100,136 68,123 68,77"
           fill="#fbbf24" opacity="0.04"/>

  <!-- === 层9: 内六边形（小） === -->
  <polygon points="100,78 118,86 118,114 100,122 82,114 82,86"
           fill="none" stroke="#fde68a" stroke-width="1" opacity="0.5"/>

  <!-- === 层10: 引擎闪电（三层叠加，立体感） === -->
  <!-- 底层大光晕 -->
  <polyline points="85,60 115,88 100,92 125,130 88,104 100,98"
            fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.15"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中层 -->
  <polyline points="85,60 115,88 100,92 125,130 88,104 100,98"
            fill="none" stroke="#f59e0b" stroke-width="3.5" opacity="0.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 顶层亮边 -->
  <polyline points="85,60 115,88 100,92 125,130 88,104 100,98"
            fill="none" stroke="#fef3c7" stroke-width="1.8" opacity="0.9"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#coreGlowFilter)"/>

  <!-- === 层11: 中心灵犀之光（白点 + 光晕） === -->
  <circle cx="100" cy="100" r="18" fill="url(#coreGlow)" opacity="0.7" filter="url(#coreGlowFilter)"/>
  <circle cx="100" cy="100" r="6" fill="#ffffff" opacity="0.95" filter="url(#coreGlowFilter)"/>
  <circle cx="100" cy="100" r="3" fill="#ffffff"/>

  <!-- === 层12: 四角装饰光点 === -->
  <circle cx="35" cy="35" r="2.5" fill="#60a5fa" opacity="0.5"/>
  <circle cx="165" cy="35" r="2.5" fill="#60a5fa" opacity="0.5"/>
  <circle cx="35" cy="165" r="2.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="165" cy="165" r="2.5" fill="#a78bfa" opacity="0.5"/>

  <!-- === 层13: 外圈粒子点缀 === -->
  <circle cx="100" cy="8" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="192" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="8" cy="100" r="1.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="192" cy="100" r="1.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="30.5" cy="30.5" r="1.2" fill="#6366f1" opacity="0.4"/>
  <circle cx="169.5" cy="30.5" r="1.2" fill="#6366f1" opacity="0.4"/>
  <circle cx="30.5" cy="169.5" r="1.2" fill="#6366f1" opacity="0.4"/>
  <circle cx="169.5" cy="169.5" r="1.2" fill="#6366f1" opacity="0.4"/>
</svg>
