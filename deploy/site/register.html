<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · LingXi Engine</title>
<meta name="description" content="注册灵犀引擎账号，开启你的 AI 员工赚钱之旅。">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://lingxi-engine.com/register.html">
<style>
  :root{
    --bg:#080c16; --bg2:#0e1526; --bg3:#151d33; --border:#1e293b; --border2:#334155;
    --text:#e8eefc; --text2:#9fb0cc; --text3:#63748f;
    --accent:#2563eb; --accent2:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
    position:relative; overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(37,99,235,.20), transparent 60%),
      radial-gradient(700px 420px at 90% 105%, rgba(34,197,94,.13), transparent 60%);
  }
  .wrap{width:100%; max-width:440px; position:relative; z-index:1}
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:26px}
  .orb{
    width:34px; height:34px; border-radius:50%;
    background:conic-gradient(from 0deg,#2563eb,#22c55e,#a855f7,#2563eb);
    animation:spin 5s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand span{font-weight:700; font-size:17px; letter-spacing:.3px}
  .card{
    background:rgba(14,21,38,.88); border:1px solid var(--border);
    border-radius:16px; padding:32px 30px; backdrop-filter:blur(12px);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  h1{font-size:22px; margin-bottom:6px}
  .sub{font-size:13.5px; color:var(--text2); margin-bottom:24px}
  label{display:block; font-size:12.5px; color:var(--text2); margin:0 0 7px; font-weight:600}
  .field{margin-bottom:16px}
  .row{display:flex; gap:12px}
  .row .field{flex:1}
  input{
    width:100%; background:var(--bg3); border:1px solid var(--border2);
    border-radius:10px; padding:12px 14px; color:var(--text);
    font-size:14px; font-family:inherit; outline:none; transition:.18s;
  }
  input:focus{border-color:var(--accent2); box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  input::placeholder{color:var(--text3)}
  .hint{font-size:11.5px; color:var(--text3); margin-top:6px}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:64px}
  .toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text3); font-size:12px;
    cursor:pointer; font-family:inherit; padding:6px 8px;
  }
  .toggle:hover{color:var(--accent2)}
  button.primary{
    width:100%; background:linear-gradient(135deg,var(--accent),#1d4ed8);
    border:none; border-radius:10px; padding:13px; color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:.18s; margin-top:6px;
  }
  button.primary:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 8px 22px rgba(37,99,235,.42)}
  button.primary:disabled{opacity:.55; cursor:not-allowed}
  .msg{
    margin-top:14px; padding:11px 14px; border-radius:9px;
    font-size:13px; display:none; line-height:1.55;
  }
  .msg.show{display:block}
  .msg.err{background:rgba(239,68,68,.11); border:1px solid rgba(239,68,68,.35); color:#fca5a5}
  .msg.ok{background:rgba(34,197,94,.11); border:1px solid rgba(34,197,94,.35); color:#86efac}
  .alt{margin-top:20px; text-align:center; font-size:13px; color:var(--text2)}
  .alt a{color:var(--accent2); text-decoration:none; font-weight:600}
  .alt a:hover{text-decoration:underline}
  .foot{margin-top:22px; text-align:center; font-size:12px; color:var(--text3)}
  .foot a{color:var(--text3)}
  .benefits{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px}
  .chip{
    font-size:11.5px; color:var(--text2); background:var(--bg3);
    border:1px solid var(--border); border-radius:20px; padding:5px 12px;
  }
  .back{display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--text2); text-decoration:none}
  .back:hover{color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="orb"></div>
    <span>LingXi Engine</span>
  </div>

  <div class="card">
    <h1>创建你的账号</h1>
    <p class="sub">一个账号，AI 员工 + 任务市场 + 钱包结算，全部打通</p>

    <div class="benefits">
      <span class="chip">🆓 免费下载试用</span>
      <span class="chip">MIT 开源</span>
      <span class="chip">🔒 数据留在本机</span>
    </div>

    <form id="f" autocomplete="off">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="dn">昵称</label>
          <input id="dn" type="text" placeholder="怎么称呼你" maxlength="30">
        </div>
        <div class="field">
          <label for="ic">邀请码 <span style="color:var(--text3);font-weight:400">(选填)</span></label>
          <input id="ic" type="text" placeholder="没有就留空" maxlength="32">
        </div>
      </div>
      <div class="field">
        <label for="pw">密码</label>
        <div class="pw-wrap">
          <input id="pw" type="password" placeholder="至少 8 位" required>
          <button type="button" class="toggle" data-pw="pw">显示</button>
        </div>
        <div class="hint">建议字母 + 数字，8 位以上</div>
      </div>
      <div class="field">
        <label for="pw2">确认密码</label>
        <div class="pw-wrap">
          <input id="pw2" type="password" placeholder="再输入一次" required>
          <button type="button" class="toggle" data-pw="pw2">显示</button>
        </div>
      </div>
      <button class="primary" id="submit" type="submit">免费注册</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="alt">已有账号？<a href="/login.html">去登录</a></div>
  </div>

  <div class="foot">© 2026 LingXi Engine · <a href="/">返回官网首页</a></div>
  <a class="back" href="/">← 返回首页</a>
</div>

<script>
(function () {
  var API = location.origin + '/api';
  var $ = function (id) { return document.getElementById(id); };

  // 密码显示切换
  document.querySelectorAll('[data-pw]').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = $(b.getAttribute('data-pw'));
      var show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      b.textContent = show ? '隐藏' : '显示';
    });
  });

  function say(kind, text) {
    var m = $('msg');
    m.className = 'msg show ' + kind;
    m.textContent = text;
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = $('email').value.trim();
    var dn = $('dn').value.trim();
    var ic = $('ic').value.trim();
    var pw = $('pw').value;
    var pw2 = $('pw2').value;
    var btn = $('submit');

    if (!email || email.indexOf('@') < 1) return say('err', '请输入有效的邮箱地址');
    if (pw.length < 8) return say('err', '密码至少 8 位');
    if (pw !== pw2) return say('err', '两次输入的密码不一致');

    btn.disabled = true;
    btn.textContent = '注册中…';

    fetch(API + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        password: pw,
        display_name: dn || email.split('@')[0],
        invite_code: ic || undefined,
        agent_binding: 'auto_default'
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (r) {
        if (r.s < 200 || r.s >= 300 || !r.d.ok) {
          btn.disabled = false; btn.textContent = '免费注册';
          return say('err', r.d.error || r.d.message || '注册失败，请稍后再试');
        }
        // 保存令牌（与引擎内 app.js 的 key 对齐）
        var tk = r.d.token || r.d.accessToken || r.d.access_token;
        if (tk) {
          try {
            var u = r.d.user || {};
            localStorage.setItem('authToken', tk);
            localStorage.setItem('userId', String(u.id || u.sub || ''));
            localStorage.setItem('displayName', u.username || u.display_name || u.displayName || email);
          } catch (e) {}
        }
        say('ok', '注册成功！正在进入你的工作台…');
        setTimeout(function () {
          location.href = '/chat/';
        }, 900);
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = '免费注册';
        say('err', '网络连接失败，请确认官网服务正在运行');
      });
  });
})();
</script>
</body>
</html>
