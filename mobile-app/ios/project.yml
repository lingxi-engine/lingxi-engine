name: LingxiEngine

options:
  bundleIdPrefix: com.lingxi
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 改成你自己的 Apple 开发者 Team ID
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # 引擎连接用 http 内网地址，链接层保持明文可用
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  LingxiEngine:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: EngineViewController.swift
    info:
      path: LingxiEngine-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingxi.engine
        PRODUCT_NAME: 灵犀引擎
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # 无第三方依赖，不需要额外 framework
        OTHER_LDFLAGS: ""
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: UniformTypeIdentifiers.framework
