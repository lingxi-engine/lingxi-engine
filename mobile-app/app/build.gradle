plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lingxi.engine'
    compileSdk 34

    defaultConfig {
        applicationId "com.lingxi.engine"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1-webview"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 测试包用 debug 签名，官网直装验证用
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
