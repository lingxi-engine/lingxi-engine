plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lingxi.engine'
    compileSdk 34

    defaultConfig {
        applicationId "com.lingxi.engine"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.0-app"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 测试包用 debug 签名，官网直装验证用
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 刻意保持零第三方依赖：App 内不含推理运行时，全部算力在引擎端
}
