name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  python-engine:
    name: Python engine regression (152 assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full regression
        working-directory: lingxi_engine/tests
        run: |
          python run_all.py
          cat run_all_result.txt
      - name: Assert ALL_OK
        working-directory: lingxi_engine/tests
        run: grep -q "ALL_OK=True" run_all_result.txt || (echo "regression failed" && exit 1)

  ts-engine:
    name: TS engine (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Failover live probe (opt-in)
        # v2.0.45: this probe makes REAL paid AI calls. It failed CI with HTTP 402
        # (Insufficient Balance) — a billing state, not a code regression. Live
        # probes must never gate CI on account balance, so this step is opt-in:
        # set repository variable LIVE_FAILOVER_TEST=true to run it manually.
        # Deterministic failover coverage lives in the vitest suite below.
        if: ${{ vars.LIVE_FAILOVER_TEST == 'true' }}
        run: |
          if grep -q "getFailoverCandidates" src/ai/hub.ts; then
            npx tsx tests/verify-failover.ts
          else
            echo "::notice::hub.ts has no failover implementation yet; skipping"
          fi
      - name: TypeScript type check
        # 2026-09-17 fix: remove continue-on-error and head pipe (pipe swallows tsc exit code)
        run: npx tsc --noEmit --skipLibCheck

      - name: Vitest suite + coverage ratchet (649 tests)
        # v2.0.42: runs the FULL suite and collects coverage in one pass.
        # Thresholds in vitest.config.ts act as a ratchet: coverage only goes up.
        run: npx vitest run --coverage

      - name: README consistency gate
        # 2026-10-21: scripts/check-docs.mts existed since 2026-09-28 but was NEVER
        # wired into CI. Result: README drifted for three weeks (tool count 15 vs
        # real 56, channel count missing, sandbox claimed default-on while code
        # requires opt-in) and nobody noticed until it was run by hand.
        # This gate asserts the README's concrete numbers against the source tree,
        # so a stale README fails CI instead of misleading users.
        run: npx tsx scripts/check-docs.mts

  hygiene-check:
    name: Workspace hygiene check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: BOM gate on critical configs
        # 2026-09-18 fix: main 分支 package.json 曾带 UTF-8 BOM(EF BB BF)，tsx 启动即报
        # "Error parsing package.json"（run 35250772658）。门禁只扫关键构建配置，
        # 历史遗留的 17 个 BOM 文件不在范围内（避免误伤），新增 BOM 会直接红灯。
        run: |
          set -euo pipefail
          BAD=0
          for f in package.json package-lock.json tsconfig.json .github/workflows/ci.yml; do
            if [ -f "$f" ] && [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error::$f has UTF-8 BOM"
              BAD=1
            fi
          done
          [ "$BAD" = "0" ] && echo "BOM gate: all critical configs clean"
      - name: Count junk files (hard gate)
        # 2026-09-20: warning -> error. Tracked junk count verified 0 on main
        # (141 local .bak files are all gitignored), so hard-failing at >100 is safe
        # and prevents junk from ever being committed again.
        run: |
          BAK=$(find . -path ./node_modules -prune -o \( -name '*.bak' -o -name '*.~1~' -o -name '*.bak-*' -o -name '*.pre-*' \) -print | wc -l)
          echo "junk files: $BAK"
          if [ "$BAK" -gt 100 ]; then
            echo "::error::too many junk files ($BAK > 100); clean up before merging"
            exit 1
          fi
      - name: Monolith line ratchet
        # 2026-09-20: ratchet gate. Root index.ts and web/js/app.js are known
        # monoliths; a previous split attempt regressed silently. This gate only
        # prevents GROWTH - every refactor that shrinks a file should also lower
        # its cap here (ratchet down, never up).
        # v2.0.45 ONE-TIME RE-BASELINE (documented, per the gate's own rule):
        # v2.0.43/44 added legitimate features (app-connect routes + relay,
        # metrics wiring, self-host registration gate, RAG routes, restored
        # web/app console) which grew index.ts 4900->5088 and app.js 5400->5906.
        # Caps are re-pinned to the CURRENT measured line counts so any further
        # growth fails again. Refactor plan (roadmap): continue extracting
        # index.ts route blocks into src/routes/* and app.js panels into
        # web/js/modules/*; lower these caps with each extraction.
        run: |
          set -euo pipefail
          FAIL=0
          check() {
            local file="$1" cap="$2"
            if [ -f "$file" ]; then
              lines=$(wc -l < "$file")
              echo "$file: $lines lines (cap $cap)"
              if [ "$lines" -gt "$cap" ]; then
                echo "::error::$file grew to $lines lines (cap $cap). Split it or raise the cap ONLY with an approved refactor plan."
                FAIL=1
              fi
            fi
          }
          check index.ts 5088
          check web/js/app.js 5906
          check src/storage/db.ts 2300
          [ "$FAIL" = "0" ] && echo "line ratchet: all monoliths within caps"

      - name: "Shell scripts - syntax check + LF gate"
        # 2026-09-25: site/install.sh 会被 pack-release.ps1 打进 tarball，分发给 Linux/macOS 用户。
        # CRLF 换行会让它直接 "bad interpreter: /bin/bash^M" 或语法错误 —— 安装器全盘失效。
        # 实测复现：core.autocrlf=true 且仓库无 .gitattributes 时，一次全新检出就把该文件
        # 变成 542 个 CRLF。.gitattributes 已钉死 eol=lf，此处是第二道防线。
        run: |
          set -euo pipefail
          echo "== bash -n =="
          FOUND=0
          for f in $(git ls-files '*.sh'); do
            FOUND=1
            echo "-- $f"
            bash -n "$f"
          done
          [ "$FOUND" = "1" ] || { echo "::error::no tracked *.sh found; gate is not actually testing anything"; exit 1; }
          echo "== LF gate on *.sh =="
          BAD=0
          for f in $(git ls-files '*.sh'); do
            if grep -qU $'\r' "$f"; then
              echo "::error::$f contains CRLF line endings; shell scripts must be LF (see .gitattributes: *.sh text eol=lf)"
              BAD=1
            fi
          done
          [ "$BAD" = "0" ] && echo "LF gate: all tracked shell scripts are clean"

      - name: Installer logic tests
        # 抽取式测试：直接从真实 install.sh 中提取补丁块与 run() 实现，
        # 因此实现被改坏时测试不会"假装还绿"。
        run: |
          set -euo pipefail
          # 2026-09-25: 覆盖 install.sh 的「站点索引版本兜底」——dry-run 不得再显示 vunknown，
          # 且站点不可达时必须如实报 unknown（不编造版本号）
          bash scripts/test-install-linger.sh
          bash scripts/test-version-parse.sh
          bash scripts/test-install-version-fallback.sh
          # 2026-09-25: 覆盖 install.sh 的「Linux 有图形会话自动打开 / 无头打印 SSH 隧道指引」——
          # 有图形必须真调 xdg-open，无头必须打印可复制命令，dry-run 不得打开浏览器
          bash scripts/test-install-browser-open.sh
