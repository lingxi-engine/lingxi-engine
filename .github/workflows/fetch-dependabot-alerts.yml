name: Fetch Dependabot Alerts
# Exports Dependabot alerts to a downloadable artifact (JSON).
# The Actions GITHUB_TOKEN shares a per-repo installation rate limit with other
# CI jobs. On 403/429 the fetch step retries with 60s backoff (up to 10x).
# If all retries fail, the job FAILS LOUDLY (exit 1) instead of uploading a
# misleading empty artifact — a red run is a signal, an empty green run is a lie.
# The 403/429 response body is printed so a real permission denial ("resource
# not accessible by integration") is distinguishable from genuine rate limiting.

on:
  workflow_dispatch:

permissions:
  security-events: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Fetch Dependabot alerts (paginated, retry on 403/429)
        env:
          GITHUB_REPO: lingxi-engine/lingxi-engine
          GITHUB_API: https://api.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=dependabot-alerts.json
          echo '[]' > "$OUT"
          PAGE=1
          MAX_PAGES=20
          while [ "$PAGE" -le "$MAX_PAGES" ]; do
            echo "Fetching page $PAGE..."
            URL="$GITHUB_API/repos/$GITHUB_REPO/dependabot/alerts?per_page=100&page=$PAGE"
            HTTP="000"
            TRY=1
            while [ "$TRY" -le 10 ]; do
              HTTP=$(curl -sS -o page.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "$URL" || echo 000)
              if [ "$HTTP" = "200" ]; then break; fi
              if [ "$HTTP" = "403" ] || [ "$HTTP" = "429" ]; then
                echo "HTTP $HTTP (attempt $TRY/10), backing off 60s. Response body:"
                head -c 400 page.json || true
                echo ""
                sleep 60
                TRY=$((TRY+1))
              else
                echo "FATAL: API returned unexpected HTTP $HTTP."
                cat page.json || true
                exit 1
              fi
            done
            if [ "$HTTP" != "200" ]; then
              echo "FATAL: page $PAGE still failing after 10 retries (last HTTP $HTTP)."
              echo "Last response body:"
              head -c 400 page.json || true
              echo ""
              echo "Failing the job so an empty artifact can never masquerade as success."
              exit 1
            fi
            if [ "$(jq -r 'type' page.json)" != "array" ]; then echo "FATAL: response is not an array (HTTP $HTTP)."; exit 1; fi
            LEN=$(jq 'length' page.json)
            if [ "$LEN" -eq 0 ]; then echo "No more alerts."; break; fi
            jq -s 'add' "$OUT" page.json > tmp.json && mv tmp.json "$OUT"
            if [ "$LEN" -lt 100 ]; then break; fi
            PAGE=$((PAGE+1))
          done
          rm -f page.json tmp.json
          jq . "$OUT" > dependabot-alerts.pretty.json
          echo "Total alerts: $(jq 'length' "$OUT")"

      - name: Upload alert artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-alerts
          path: dependabot-alerts.pretty.json