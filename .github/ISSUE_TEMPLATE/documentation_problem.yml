name: Documentation problem
description: Report incorrect, missing, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: page
    attributes:
      label: Affected page or file
      placeholder: README.md, CONTRIBUTING.md, docs/roadmap.md, etc.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
