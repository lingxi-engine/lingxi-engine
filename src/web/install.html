<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>安装灵犀引擎</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  padding-top: calc(24px + env(safe-area-inset-top));
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
.install-card {
  width: 100%;
  max-width: 380px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 20px;
  padding: 40px 28px;
  text-align: center;
}
.app-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(135deg, #4a9eff, #7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
}
.app-icon img { width: 56px; height: 56px; }
.app-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.app-desc { font-size: 14px; color: #8b949e; margin-bottom: 32px; }

.install-btn {
  display: block;
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #4a9eff;
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  text-decoration: none;
}
.install-btn:active { opacity: 0.8; }
.install-btn.hidden { display: none; }

.steps {
  display: none;
  text-align: left;
  margin-top: 24px;
  padding: 20px;
  background: #0d1117;
  border-radius: 12px;
  border: 1px solid #30363d;
}
.steps.show { display: block; }
.steps h3 { font-size: 15px; margin-bottom: 12px; color: #4a9eff; }
.steps ol { padding-left: 20px; }
.steps li {
  font-size: 14px;
  color: #c9d1d9;
  margin-bottom: 10px;
  line-height: 1.5;
}
.steps li strong { color: #e6edf3; }

.status {
  margin-top: 20px;
  font-size: 13px;
  color: #8b949e;
}
.status.ok { color: #3fb950; }
.status.err { color: #f85149; }

.badge {
  display: inline-block;
  margin-top: 16px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  background: #21262d;
  color: #8b949e;
}
.footer {
  margin-top: 32px;
  font-size: 12px;
  color: #484f58;
}
.footer a { color: #4a9eff; text-decoration: none; }
</style>
</head>
<body>

<div class="install-card">
  <div class="app-icon">
    <img src="/icon.svg" alt="灵犀引擎">
  </div>
  <div class="app-name">灵犀引擎</div>
  <div class="app-desc">AI 智能体 · 本地运行 · 隐私安全</div>

  <!-- Android 一键安装按钮 -->
  <button class="install-btn hidden" id="installBtn">📲 安装到手机</button>

  <!-- 打开应用按钮（已安装时显示） -->
  <a class="install-btn" id="openBtn" href="/" style="background:#238636;">打开灵犀引擎</a>

  <!-- iOS 安装步骤 -->
  <div class="steps" id="iosSteps">
    <h3>📱 iPhone 安装方法</h3>
    <ol>
      <li>点击底部工具栏的 <strong>分享按钮</strong> <span style="font-size:18px">⬆️</span></li>
      <li>向下滑动，找到并点击 <strong>「添加到主屏幕」</strong></li>
      <li>点击右上角 <strong>「添加」</strong></li>
      <li>在主屏幕找到 <strong>灵犀引擎</strong> 图标，点击打开 🎉</li>
    </ol>
  </div>

  <!-- Android 手动安装步骤 -->
  <div class="steps" id="androidSteps">
    <h3>📱 Android 安装方法</h3>
    <ol>
      <li>点击浏览器右上角 <strong>菜单 ⋮</strong></li>
      <li>选择 <strong>「添加到主屏幕」</strong> 或 <strong>「安装应用」</strong></li>
      <li>确认安装，在主屏幕找到 <strong>灵犀引擎</strong> 🎉</li>
    </ol>
  </div>

  <div class="status" id="status"></div>
  <div class="badge" id="platformBadge"></div>
</div>

<div class="footer">
  <a href="/">← 返回主页</a> · v2.0.5
</div>

<script>
(function() {
  const installBtn = document.getElementById('installBtn');
  const iosSteps = document.getElementById('iosSteps');
  const androidSteps = document.getElementById('androidSteps');
  const status = document.getElementById('status');
  const badge = document.getElementById('platformBadge');

  let deferredPrompt = null;

  // 检测平台
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || navigator.standalone === true;

  if (isStandalone) {
    status.textContent = '✅ 已安装，正在运行中';
    status.className = 'status ok';
    badge.textContent = '已安装';
  } else if (isIOS) {
    badge.textContent = 'iOS / iPhone';
    iosSteps.classList.add('show');
    // Safari 才显示步骤
    const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS/i.test(ua);
    if (!isSafari) {
      status.textContent = '💡 建议使用 Safari 浏览器安装';
    }
  } else if (isAndroid) {
    badge.textContent = 'Android';
    androidSteps.classList.add('show');
  } else {
    badge.textContent = '桌面端';
    status.textContent = '请用手机浏览器打开此页面';
  }

  // 捕获 Android beforeinstallprompt 事件
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.remove('hidden');
    androidSteps.classList.remove('show');
    status.textContent = '';
  });

  // 一键安装
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      androidSteps.classList.add('show');
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      status.textContent = '✅ 安装成功！在主屏幕找到灵犀引擎';
      status.className = 'status ok';
      installBtn.classList.add('hidden');
    } else {
      status.textContent = '已取消安装';
    }
    deferredPrompt = null;
  });

  // 已安装后隐藏按钮
  window.addEventListener('appinstalled', () => {
    installBtn.classList.add('hidden');
    status.textContent = '✅ 安装成功！';
    status.className = 'status ok';
  });

  // 检测引擎状态
  fetch('/api/health').then(r => r.json()).then(d => {
    if (d.status === 'ok') {
      const openBtn = document.getElementById('openBtn');
      openBtn.style.display = 'block';
    }
  }).catch(() => {});
})();
</script>
</body>
</html>
